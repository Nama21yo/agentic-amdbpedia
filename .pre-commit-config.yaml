repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uvx ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format check
        entry: uvx ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: uvx --with pydantic --with pydantic-settings --with pytest --with hypothesis --with 'mcp[cli]' --with groq mypy config.py errors.py logging_config.py rag mcp_server scripts tests
        language: system
        pass_filenames: false
      - id: pytest-unit
        name: pytest unit
        entry: uvx --with pydantic --with pydantic-settings --with pytest --with pytest-asyncio --with hypothesis --with 'mcp[cli]' --with groq --with qdrant-client pytest -m "not integration and not e2e and not perf"
        language: system
        pass_filenames: false
