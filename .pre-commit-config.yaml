repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uvx ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format check
        entry: uvx ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: uv run --frozen mypy config.py errors.py logging_config.py rag mcp_server scripts tests
        language: system
        pass_filenames: false
      - id: pytest-unit
        name: pytest unit
        entry: uv run --frozen pytest -m "not integration and not e2e and not perf"
        language: system
        pass_filenames: false
