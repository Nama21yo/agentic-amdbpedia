repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uvx ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format check
        entry: uvx ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: uvx --with pydantic --with pydantic-settings --with pytest mypy config.py rag mcp_server scripts tests
        language: system
        pass_filenames: false
      - id: pytest-unit
        name: pytest unit
        entry: uvx --with pydantic --with pydantic-settings --with pytest pytest -m "not integration and not e2e"
        language: system
        pass_filenames: false
