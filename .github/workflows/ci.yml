name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: extractions/setup-just@v3
      - name: Secret scan
        run: |
          if grep -RInE '(gsk_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,})' \
            --exclude-dir=.git --exclude=uv.lock .; then
            echo "Potential API key detected"
            exit 1
          fi
      - name: Lint and type check
        run: just lint

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: extractions/setup-just@v3
      - name: Unit tests
        run: just test

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Start Qdrant
        run: docker compose up -d qdrant
      - name: Integration tests
        run: just test-integration
  e2e-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Start Qdrant
        run: docker compose up -d qdrant
      - name: End-to-end tests
        run: just test-e2e
  perf-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Latency budget benchmarks
        run: just test-perf
