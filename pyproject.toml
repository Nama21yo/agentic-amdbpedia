[project]
name = "cross-lingual-knowledge-assistant"
version = "0.1.0"
description = "Amharic-to-English DBpedia ontology mapping assistant using hybrid RAG and MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.7.0",
    "groq>=0.31.0",
    "mcp[cli]>=1.10.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "qdrant-client>=1.14.0",
    "sentence-transformers>=5.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.135.0",
    "mypy>=1.16.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.2.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["config.py", "errors.py", "logging_config.py", "rag", "mcp_server", "scripts", "tests"]

[[tool.mypy.overrides]]
module = [
    "fastembed",
    "fastembed.*",
    "qdrant_client",
    "qdrant_client.*",
    "sentence_transformers",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require external services such as Qdrant",
    "e2e: full end-to-end tests",
    "perf: scheduled latency budget benchmarks",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.coverage.run]
source = ["rag"]
