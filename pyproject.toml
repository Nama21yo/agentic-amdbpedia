[project]
name = "cross-lingual-knowledge-assistant"
version = "0.1.0"
description = "Amharic-to-English DBpedia ontology mapping assistant using hybrid RAG and MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.7.0",
    "groq>=0.31.0",
    "mcp[cli]>=1.10.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "qdrant-client>=1.14.0",
    "sentence-transformers>=5.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.135.0",
    "mypy>=1.16.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
