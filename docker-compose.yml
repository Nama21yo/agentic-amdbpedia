services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mapping_assistant
      POSTGRES_PASSWORD: mapping_assistant
      POSTGRES_DB: mapping_assistant
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapping_assistant -d mapping_assistant"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Manual/documentation convenience only (refs implementation.md 15.1) --
  # mcp_server/qa.py::verify_extraction() never depends on this service
  # being up; it starts and stops its own throwaway container per
  # verification call (`docker run ... -f <specific .nt file>`). Useful
  # here for poking at a loaded graph by hand: `docker compose run --rm
  # tentris -f /data/<file>.nt` (mount the file under ./data first).
  tentris:
    image: dicegroup/tentris_server:latest
    ports:
      - "9080:9080"
    volumes:
      - ./data:/data:ro
    command: ["-p", "9080", "--logfile=false"]

volumes:
  postgres_data:
